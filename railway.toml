[deploy]
startCommand = "uv run python main.py"
import logging
from urllib.parse import quote

from telegram import Update, InlineKeyboardButton, InlineKeyboardMarkup
from telegram.ext import (
    ApplicationBuilder, CommandHandler,
    CallbackQueryHandler, MessageHandler,
    ContextTypes, filters
)

# ====== بيانات البوت ======
TOKEN = "8468175474:AAEk0F3dYEG4PXCKjLQJtnJiNoSgatCuSnY"
WHATSAPP_NUMBER = "9647844306049"
ADMIN_ID = 656150043

logging.basicConfig(level=logging.INFO)

# ================= التبرعات =================
donations = {
    "1": "كفالة يتيم",
    "2": "مجمع ولاية الضامن",
    "3": "فقراء والايتام",
    "4": "شيعة ايران ولبنان"
}

# ================= العملات =================
currencies = {
    "العراق": "دينار عراقي",
    "السعودية": "ريال سعودي",
    "الإمارات": "درهم إماراتي",
